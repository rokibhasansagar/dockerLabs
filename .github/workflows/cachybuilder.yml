name: CachyOS Docker Builder

on:
  push:
    branches: [ main ]
    paths:
      - 'cachy/Dockerfile'
  workflow_dispatch:
  schedule:
    # Runs Everyday at 03:00 UTC
    - cron: '0 3 * * *'

concurrency:
  group: ci-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      platform: "linux/amd64"
      DockerID: "cachy-base"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: 'main'
      - name: Enable KVM group perms [Experimental]
        run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU [Optional]
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"
      - name: Docker Metadata action
        id: docker_meta_native
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DockerID }}
            ghcr.io/${{ github.repository_owner }}/${{ env.DockerID }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YY.MM.DDDD.HHmm' tz='Asia/Dhaka'}},enable=true
      - name: Build & Push the Docker image
        id: docker_build_native
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: true
          DOCKER_BUILD_RECORD_UPLOAD: true
        with:
          allow: security.insecure
          context: "{{defaultContext}}:cachy"
          file: Dockerfile
          platforms: ${{ env.platform }}
          push: true
          provenance: false
          tags: ${{ steps.docker_meta_native.outputs.tags }}
          labels: |
            maintainer="fr3akyphantom <rokibhasansagar2014@outlook.com>"
            org.opencontainers.image.authors="fr3akyphantom <rokibhasansagar2014@outlook.com>"
            org.opencontainers.image.licenses=MIT
          outputs: type=registry
      - name: Image digest (Native)
        run: echo ${{ steps.docker_build_native.outputs.digest }}
        
